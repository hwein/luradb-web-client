[package]
name = "app"
version = "0.0.4-dev"
description = "LuraDB Client — Desktop-Shell (Tauri 2)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-http = { version = "2", features = ["dangerous-settings"] }
