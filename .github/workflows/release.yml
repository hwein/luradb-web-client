name: release

# Releases are cut with `npm run release` on the `next` branch (see
# scripts/release.mjs): it finalizes the changelog, bumps the version, merges
# next → main, tags vX.Y.Z and pushes. The tag triggers this workflow, which
# builds the Windows app (unsigned) and drafts a GitHub release with the
# matching changelog section as its notes.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Release notes from changelog
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<CHANGELOG_EOF'
            node scripts/changelog-extract.mjs "${GITHUB_REF_NAME#v}"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
