name: ci

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Public text in commit messages
        run: node scripts/check-public-text.mjs --commits
      - run: npm test
